<!DOCTYPE html>
<html>
<head>
    <style>
        .inp_button{
            width: 290px;
            height:19px;
            margin-bottom: 3px;
            border-width: 2px;
            border-style: solid;
            border-radius: 2px;
        }
        .email{
            color: rgb(81, 80, 80);
            font-family: Arial;
            font-size: 12px;
            margin-bottom: 5px;
        }
        .txt{
            color: rgb(81, 80, 80);
            font-family: Arial;
            font-size: 12px;
            margin-bottom: 14px;
        }
        .btn{
            background-color:rgba(10,102,194);
            color: white;
            border: None;
            width: 290px;
            height:39px;
            border-radius: 39px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <p class="email">
        Email
    </p>
    <input class="inp_button" type="text">
    <p class="txt">
        By clicking Agree & Join, you agree to the privacy policy.
    </p>
    <button class="btn">
        Agree & Join
    </button>
</body>
</html>
